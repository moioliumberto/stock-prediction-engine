[project]
name = "stock-prediction-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "yfinance>=1.8.0",
]

[project.scripts]
stock-prediction-engine = "stock_prediction_engine:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
